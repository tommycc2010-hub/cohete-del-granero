<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cohete del Granero</title>
<style>
  :root { --ink:#1d1d1d; --paper:#fff6e5; --green:#5cc46b; --blue:#4aa3e8; --yellow:#ffd23f; --red:#e5483b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    display: flex; align-items: center; justify-content: center;
    background: #8ed1f0; color: var(--ink);
    font-family: "Trebuchet MS", system-ui, sans-serif;
  }
  .wrap { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center; max-width: 1100px; width: 100%; }
  canvas {
    width: 640px; max-width: 100%; height: auto;
    border: 4px solid var(--ink); border-radius: 18px; background: #fff;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .phone {
    width: 330px; max-width: 100%; background: var(--ink);
    border-radius: 34px; padding: 14px; box-shadow: 6px 6px 0 rgba(0,0,0,.25);
  }
  .screen {
    background: var(--paper); border-radius: 22px; padding: 14px; min-height: 480px;
    display: flex; flex-direction: column; gap: 10px;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 20px; margin: 4px 0; }
  p { margin: 4px 0; }
  .stat {
    display: flex; justify-content: space-between; font-weight: bold;
    background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 6px 10px;
  }
  button {
    font: inherit; font-weight: bold; text-align: left; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 12px; padding: 10px;
    background: var(--yellow); color: var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-verde { background: var(--green); }
  .btn-azul { background: var(--blue); }
  .log {
    font-size: 13px; background: #fff; border: 3px dashed var(--ink);
    border-radius: 12px; padding: 8px; min-height: 60px; margin-top: auto;
  }
  small { opacity: .8; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="escena" width="640" height="420"></canvas>
  <div class="phone"><div class="screen" id="pantalla"></div></div>
</div>
<script src="datos.js"></script>
<script src="juego.js"></script>
</body>
</html>
